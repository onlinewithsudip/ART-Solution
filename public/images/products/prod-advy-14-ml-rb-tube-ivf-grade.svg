<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc" />
        <stop offset="50%" stop-color="#f1f5f9" />
        <stop offset="100%" stop-color="#e2e8f0" />
      </linearGradient>
      <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="20%" stop-color="#f8fafc" stop-opacity="0.6" />
        <stop offset="80%" stop-color="#e2e8f0" stop-opacity="0.7" />
        <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.9" />
      </linearGradient>
      <linearGradient id="liquidMediaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.85" />
        <stop offset="100%" stop-color="#fdba74" stop-opacity="0.95" />
      </linearGradient>
      <linearGradient id="amberGlassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
        <stop offset="50%" stop-color="#b45309" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#78350f" stop-opacity="0.95" />
      </linearGradient>
      <linearGradient id="goldenOilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#fde68a" stop-opacity="0.95" />
      </linearGradient>
      <linearGradient id="plasticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.85" />
      </linearGradient>
      <linearGradient id="lidGlassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.4" />
      </linearGradient>
      <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38bdf8" />
        <stop offset="100%" stop-color="#0284c7" />
      </linearGradient>
      <linearGradient id="liquidRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fecaca" />
        <stop offset="100%" stop-color="#f87171" />
      </linearGradient>
      <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#cbd5e1" stroke-width="0.5" opacity="0.4" />
      </pattern>
    </defs>

    <!-- Studio Clean Background -->
    <rect width="600" height="450" fill="url(#bgGrad)" />
    <rect width="600" height="450" fill="url(#gridPattern)" />

    <!-- Ambient Vignette Ring -->
    <ellipse cx="300" cy="240" rx="240" ry="160" fill="#ffffff" opacity="0.6" filter="blur(20px)" />

    <!-- Top Left Category Badge -->
    <rect x="24" y="24" width="auto" height="26" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.05))" />
    <g transform="translate(34, 41)">
      <circle cx="4" cy="-3" r="3.5" fill="#0284c7" />
      <text x="14" y="0" font-size="10" font-weight="bold" fill="#334155" font-family="sans-serif">DISPOSABLES & LABWARE</text>
    </g>

    <!-- Top Right Authentic Supply Badge -->
    <rect x="430" y="24" width="146" height="26" rx="6" fill="#047857" opacity="0.1" />
    <rect x="430" y="24" width="146" height="26" rx="6" fill="none" stroke="#10b981" stroke-width="1" />
    <text x="503" y="41" font-size="10" font-weight="bold" fill="#047857" text-anchor="middle" font-family="sans-serif">AUTHENTIC BATCH CERTIFIED</text>

    <!-- Center Product Graphic -->
    
      <!-- Shadow -->
      <ellipse cx="300" cy="285" rx="40" ry="8" fill="#000000" opacity="0.15" filter="blur(4px)" />
      <!-- Conical / Round Bottom Tube Body -->
      <path d="M 270 120 L 330 120 L 330 240 L 300 280 L 270 240 Z" fill="url(#plasticGrad)" stroke="#94a3b8" stroke-width="2" />
      <!-- Liquid Contents -->
      <path d="M 273 160 L 327 160 L 327 238 L 300 274 L 273 238 Z" fill="url(#liquidMediaGrad)" opacity="0.75" />
      <!-- Graduations -->
      <line x1="272" y1="150" x2="288" y2="150" stroke="#ffffff" stroke-width="1.5" />
      <line x1="272" y1="170" x2="295" y2="170" stroke="#ffffff" stroke-width="2" />
      <text x="302" y="173" font-size="8" font-weight="bold" fill="#ffffff">15 ml</text>
      <line x1="272" y1="190" x2="288" y2="190" stroke="#ffffff" stroke-width="1.5" />
      <line x1="272" y1="210" x2="295" y2="210" stroke="#ffffff" stroke-width="2" />
      <text x="302" y="213" font-size="8" font-weight="bold" fill="#ffffff">10 ml</text>
      <line x1="272" y1="230" x2="288" y2="230" stroke="#ffffff" stroke-width="1.5" />
      <!-- White Frosted Writing Spot -->
      <rect x="285" y="130" width="30" height="20" rx="2" fill="#ffffff" opacity="0.85" />
      <!-- Blue Dome Screw Cap -->
      <rect x="265" y="100" width="70" height="22" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
      <line x1="275" y1="100" x2="275" y2="122" stroke="#38bdf8" stroke-width="1" />
      <line x1="285" y1="100" x2="285" y2="122" stroke="#38bdf8" stroke-width="1" />
      <line x1="300" y1="100" x2="300" y2="122" stroke="#38bdf8" stroke-width="1" />
      <line x1="315" y1="100" x2="315" y2="122" stroke="#38bdf8" stroke-width="1" />
      <line x1="325" y1="100" x2="325" y2="122" stroke="#38bdf8" stroke-width="1" />
    

    <!-- Bottom Product Description Banner -->
    <rect x="20" y="360" width="560" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
    <!-- Brand Tag -->
    <rect x="36" y="374" width="auto" height="18" rx="4" fill="#0284c7" opacity="0.15" />
    <text x="42" y="387" font-size="9" font-weight="bold" fill="#0284c7" font-family="sans-serif">ADVY</text>
    <!-- Code Tag -->
    <text x="160" y="387" font-size="9" font-family="monospace" fill="#64748b">REF: ART-ADVY-157</text>
    <!-- Product Name -->
    <text x="36" y="408" font-size="13" font-weight="bold" fill="#0f172a" font-family="sans-serif">Advy 14 ml RB Tube ( IVF Grade )</text>
    <!-- Pack Size -->
    <text x="36" y="422" font-size="10" font-family="monospace" fill="#475569">Pack Size: Single Sterile | FY 25-26 Supply Rate Validated</text>
  </svg>
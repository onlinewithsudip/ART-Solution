  <!-- Tagline: OFFERING FULL SOLUTION -->
  <text x="112" y="85" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" letter-spacing="3.5" fill="#0F2C59">
    OFFERING FULL SOLUTION
  </text>
</svg>
